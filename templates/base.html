<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Traenergie — Solutions Électriques{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Traenergie, votre expert en services électriques et vente d'équipements électriques en Guinée.{% endblock %}">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            electric: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
            gold: { 400: '#fbbf24', 500: '#f59e0b' },
            navy: { 900: '#0a0f1e', 800: '#0f172a', 700: '#1e293b' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
            glow: { from: { 'box-shadow': '0 0 10px #06b6d4' }, to: { 'box-shadow': '0 0 30px #06b6d4, 0 0 60px #06b6d4' } },
          },
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- AOS Animations -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.0"></script>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-navy-900 text-white font-sans antialiased">

  {% include "partials/navbar.html" %}

  {% if messages %}
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2">
    {% for message in messages %}
    <div x-data="{ show: true }" x-show="show" x-transition
         class="flex items-center gap-3 px-4 py-3 rounded-xl backdrop-blur-lg border max-w-sm
                {% if message.tags == 'success' %}bg-green-500/20 border-green-500/30 text-green-300
                {% elif message.tags == 'error' %}bg-red-500/20 border-red-500/30 text-red-300
                {% else %}bg-cyan-500/20 border-cyan-500/30 text-cyan-300{% endif %}">
      <span class="text-sm">{{ message }}</span>
      <button @click="show = false" class="ml-auto opacity-60 hover:opacity-100 text-lg leading-none">&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script>
    AOS.init({ duration: 800, once: true, offset: 80 });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
